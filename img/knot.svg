<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 24" width="28" height="24">
  <!-- One link of a Borre ring-chain, the band's tile (redrawn 2026-10-09
       from font/research.md): a double-contoured ring, a transverse bar at
       each joint, and a lozenge laid over the joint — the style the
       University of Nottingham describes as "interlacing circles, divided by
       transverse bars and overlaid by lozenges". Drawn here, not traced. -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M0 2 V22 M28 2 V22" stroke="#c08a2e" stroke-width="2"/>
    <circle cx="14" cy="12" r="9.5" stroke="#2e2419" stroke-width="5"/>
    <circle cx="14" cy="12" r="9.5" stroke="#c08a2e" stroke-width="1.6"/>
    <circle cx="14" cy="12" r="6" stroke="#c08a2e" stroke-width="1.6"/>
    <g stroke="#2e2419" stroke-width="5">
      <path d="M0 4 L6 12 L0 20 L-6 12 Z"/><path d="M28 4 L34 12 L28 20 L22 12 Z"/>
    </g>
    <g fill="#2e2419" stroke="#c08a2e" stroke-width="1.6">
      <path d="M0 4 L6 12 L0 20 L-6 12 Z"/><path d="M28 4 L34 12 L28 20 L22 12 Z"/>
    </g>
    <g fill="#c08a2e"><path d="M0 9 L3 12 L0 15 L-3 12 Z"/><path d="M28 9 L31 12 L28 15 L25 12 Z"/></g>
  </g>
</svg>
