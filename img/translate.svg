<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"><!-- The language picker's mark, 2026-10-09: two speech-tongues, cut as a carver cuts — straight lines, mitred corners — laid over each other like the rings of a Borre chain. The near one is weld yellow with a madder rune-stroke; the far one ochre. No flag, no colour outside the dyes. Drawn here. --><g stroke-linejoin="miter" fill="none"><path d="M3 5 H19 V16 H11 L6 21 V16 H3 Z" fill="#c08a2e" stroke="#1e1b18" stroke-width="2"/><path d="M13 12 H29 V23 H26 V28 L21 23 H13 Z" fill="#e8c84a" stroke="#1e1b18" stroke-width="2"/><path d="M17 15.5 L21 19.5 L25 15.5 M21 19.5 V15.5" stroke="#a33a28" stroke-width="2.2"/><path d="M7 9 H15 M7 12 H12" stroke="#1e1b18" stroke-width="1.6"/></g></svg>
